name: Publish to Official Model Context Protocol Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'server.json'
      - '.github/workflows/publish-mcp-registry.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Official MCP Publisher (v1.8.8)
        run: |
          curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json against Official MCP Registry
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC & Publish to Official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish || true
